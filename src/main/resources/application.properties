# ====== 固件 OTA（设备侧本地模拟）配置 ======
# 设备存储根目录（模拟设备 flash：A/B 槽、状态、历史、暂存）
firmware.ota.storage-dir=data/device-storage
# 升级包来源目录（模拟升级服务器，每个子目录是一个升级包）
firmware.ota.package-source-dir=data/packages
# 设备身份
firmware.ota.device-model=DEVICE-X1
firmware.ota.hardware-version=hw-1.0
# 出厂固件版本（首次启动安装为初始在位版本）
firmware.ota.factory-version=1.0.0
# 版本策略
firmware.ota.allow-downgrade=false
# 最低兼容版本（留空表示不限制）；低于该版本的升级一律拒绝
firmware.ota.minimum-compatible-version=
# 资源上限
firmware.ota.max-package-bytes=67108864
firmware.ota.max-storage-bytes=268435456
# 分块大小（断点续传粒度）
firmware.ota.chunk-size=4096
# 首启自检超时（毫秒）
firmware.ota.selftest-timeout-millis=2000
# 已暂存数据损坏自动重处理的次数上限（同一升级、跨重启累计）；
# 超限按 FAILED / STAGED_DATA_REPAIR_EXHAUSTED 收场并释放暂存
firmware.ota.max-repair-attempts=3

# Web 服务
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false
