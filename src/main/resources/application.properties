# 设备侧 OTA 配置（本地目录模拟设备存储与升级包来源）
# 设备存储根目录
ota.storage-root=build/device
# 设备身份
ota.device-model=DEMO-DEVICE
ota.hardware-version=1.0
# 出厂镜像
ota.factory-version=1.0.0
ota.factory-payload=factory firmware 1.0.0\n
# 升级包与存储上限
ota.max-package-bytes=67108864
ota.max-storage-bytes=268435456
# 版本策略
ota.allow-downgrade=false
ota.min-compatible-version=
# 断点续传分块大小
ota.chunk-size-bytes=65536
